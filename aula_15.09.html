<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 15/09 HTML - Imagens</title>
</head>
<body>
    <h1>Escarlata.png</h1>
    <img src="https://static.wikia.nocookie.net/ordemparanormal/images/e/e7/Arte_Completa_da_Capa_do_Hexatombe_Ep_6.jpg/revision/latest/scale-to-width-down/250?cb=20251202180424&path-prefix=pt-br" width="500" height="500" alt="Sem Escarlata por aqui" style="float: left; margin-right: 25px;">
    <p style="font-size: 40px;">Escarlataaa</p>
    <!--src = endereço da imagem (do computador ou da Internet)
    - endereço dentro do computador = usar "/" para localizar o arquivo da imagem. Se estiver uma hierarquia antes do index.html usar ../ para indicar que o arquivo está em uma pasta anterior
    - endereço da Internet = simplesmente copiar o endereço clicando com o botão direito na imagem
    width = altura
    height = comprimento
    alt = texto alternativo caso a imagem não apareça
    style = a partir daqui é CSS
    float = texto flutuante
    left = direção, neste caso, a esquerda
    margin-right = define a distância entre a imagem e o elemento seguinte a ela
    px = unidade de tamanho do CSS
    font-size = tamanho da fonte-->
</body>
</html>
